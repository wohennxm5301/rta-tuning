plugins {
    id 'com.android.application'
}
android {
    namespace 'com.rta.tuning'
    compileSdk 34
    defaultConfig {
        applicationId "com.rta.tuning"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "6.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}