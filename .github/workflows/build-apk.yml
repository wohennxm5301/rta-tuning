name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Remove fake wrapper files
        run: |
          rm -f android/gradle/wrapper/gradle-wrapper.jar
          rm -f android/gradlew android/gradlew.bat

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          generate-job-summary: false

      - name: Check pre-installed Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -la ${ANDROID_SDK_ROOT}/platforms/ 2>/dev/null || echo "No platforms"
          ls -la ${ANDROID_SDK_ROOT}/build-tools/ 2>/dev/null || echo "No build-tools"
          ls -la ${ANDROID_SDK_ROOT}/cmdline-tools/ 2>/dev/null || echo "No cmdline-tools"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Install SDK components if needed
        run: |
          if [ ! -d "${ANDROID_SDK_ROOT}/platforms/android-34" ]; then
            echo "Installing android-34 platform..."
            yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" || echo "sdkmanager not found, trying apt..."
          fi
          if [ ! -d "${ANDROID_SDK_ROOT}/build-tools/34.0.0" ]; then
            echo "Installing build-tools 34.0.0..."
            yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || echo "sdkmanager not found"
          fi
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build APK
        working-directory: android
        run: |
          rm -f local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -200
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
        if: always()