name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          rm -f local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/build.log
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Show build output (last 100 lines)
        if: always()
        run: tail -100 /tmp/build.log 2>/dev/null || echo "No build log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn