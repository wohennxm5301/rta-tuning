name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Remove fake wrapper files
        run: |
          rm -f android/gradle/wrapper/gradle-wrapper.jar
          rm -f android/gradlew android/gradlew.bat

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          generate-job-summary: false

      - name: Install SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build APK
        working-directory: android
        run: |
          rm -f local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Debug - List APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== Checking output dirs ==="
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug dir"
          ls -la android/app/build/ 2>/dev/null || echo "No build dir"

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: android/app/build/outputs/apk/debug/*.apk