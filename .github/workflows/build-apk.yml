name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          generate-job-summary: false

      - name: Generate Gradle Wrapper in android/
        working-directory: android
        run: gradle wrapper --gradle-version 8.5

      - name: Install SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build APK
        working-directory: android
        run: |
          rm -f local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Show APK files
        run: |
          find android/ -name "*.apk" -type f -ls 2>/dev/null
          find android/ -name "*.apk" -type f -exec ls -la {} \; 2>/dev/null
          ls -laR android/app/build/ 2>/dev/null | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error